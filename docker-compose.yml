version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: delivery_fraud_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: deliveryfraud_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: delivery_fraud_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/deliveryfraud_db
      - SECRET_KEY=delivery_fraud_super_secret_jwt_key_2026_change_in_prod
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: delivery_fraud_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
